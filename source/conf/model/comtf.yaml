# ComBrainTF (Com-BrainTF, MICCAI 2023) -- Community-aware Brain Transformer.
# Ported from ubc-tea/Com-BrainTF (source/models/COMTF/comtf.py +
# conf/model/comtf.yaml).
#
# NOTE on atlases:
#   The shipped node_clus_map.pickle encodes a 200-ROI Yeo-7 partition
#   with cumulative ends [41, 70, 91, 110, 130, 137, 158, 200]. The
#   model currently hardcodes 8 learnable class tokens (one per Yeo-7
#   subnetwork). If you run this on a different atlas you MUST:
#     (1) supply a new pickle via `node_clus_map_path` whose keys list
#         the desired ROI order, and
#     (2) override `subnetwork_ends` below so it has 8 entries and ends
#         at dataset.node_sz.
#   The constructor raises a clear error if any of these is violated.
name: ComBrainTF

# Token budget for each TransPoolingEncoder. sizes[0] is overwritten
# with dataset.node_sz at runtime; sizes[1] is the DEC cluster count.
sizes: [360, 8]

# Pooling flag per block. Length must equal len(sizes).
pooling: [false, true]

# `identity` or `none`. ComBrainTF does not have an rrwp branch.
pos_encoding: none

# DEC hyperparameters -- defaults match the paper.
orthogonal: true
freeze_center: true
project_assignment: true

# Size of the learned `identity` per-node bias, only used when
# pos_encoding == 'identity'.
pos_embed_dim: 360

# Number of attention heads -- 8 in the paper.
nhead: 8

# Number of global MHSA encoders stacked on top of the local
# transformer. 1 in the paper.
num_MHSA: 1

# Cumulative right-edges of each functional subnetwork; must have
# exactly 8 entries and end at dataset.node_sz. Default is the Yeo-7
# 200-ROI partition used in the paper.
subnetwork_ends: [41, 70, 91, 110, 130, 137, 158, 248]

# Optional: absolute path to a pickle whose .keys() list the desired
# ROI ordering. When unset, the model loads the bundled pickle that
# sits next to source/models/ComBrainTF/comtf.py.
# node_clus_map_path: /abs/path/to/custom_node_clus_map.pickle
