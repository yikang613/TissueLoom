# BrainNetMLP (EMA4MICCAI 2025) -- two-stream MLP on FFT of BOLD + upper
# triangle of the Pearson FC matrix. Ported from
# classification/BrainNetMLP/model/brainnetmlp.py.
#
# The hyperparameter defaults below match the authors' config/config.json.
name: BrainNetMLP

# Output classes (defaults to 2 for binary diagnosis tasks).
out_dim: 2

# (spectral_hidden, spatial_hidden). The authors use [32, 32].
hidden_dim: [32, 32]

# (spectral_dropout, spatial_dropout). Authors default to [0, 0].
drop_rate: [0.0, 0.0]

# 1 enables BatchNorm1d on the concatenated embedding; 0 uses Identity.
norm: 0

# Low-pass FFT cutoff (keeps bins [1, k), dropping DC). Must be <= T//2 + 1;
# the ported code silently clamps k to that upper bound if exceeded.
# Authors use 40 for ABIDE (T = 150 after their preprocessing).
k: 40
