# LRBGT (ALTER, yushuowiki/ALTER) -- Local Random-walk Brain Graph Transformer.
# Ported from alter/models/LRBGT/lrbgt.py + conf/model/lrbgt.yaml.
#
# The ALTER repo shipped this config with `name: BrainNetworkTransformer`,
# which collides with BNT's own class of that name. We rename the
# exported class to `LRBGT` and use that as `name:` here.
name: LRBGT

# Token budget for each TransPoolingEncoder block. The first entry is
# overwritten at runtime with `dataset.node_sz`; the last entry is the
# number of DEC cluster tokens produced by the pooling layer.
sizes: [360, 100]

# Which blocks perform DEC pooling. Length must equal len(sizes).
pooling: [false, true]

# RRWP is the positional encoding used in the paper. Alternatives are
# `identity` (learned per-node bias) or `none` (no pos encoding).
pos_encoding: rrwp

# Whether DEC should orthogonalise / freeze / project its cluster
# centres. Defaults match the ALTER paper.
orthogonal: true
freeze_center: true
project_assignment: true

# Number of random-walk steps for RRWP, or size of the `identity` pos
# embedding. With `rrwp`, `pos_embed_dim` columns are concatenated to
# each row of the Pearson matrix before attention.
pos_embed_dim: 32
